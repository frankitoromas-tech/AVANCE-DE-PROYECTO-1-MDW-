# Perfil de PRUEBAS: base de datos en memoria H2.
# No afecta la configuracion MySQL (local/prod) del proyecto.

spring.datasource.url=jdbc:h2:mem:limasalud_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Valores de JWT para las pruebas.
app.jwt.secret=ClaveSecretaDePruebasParaJWT_LimaSalud_MarcosDesarrolloWeb2026
app.jwt.expiration-ms=3600000
