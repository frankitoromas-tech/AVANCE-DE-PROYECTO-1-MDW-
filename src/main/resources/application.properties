spring.application.name=lima-salud
server.port=${PORT:8080}

# Perfil activo: local (desarrollo) | prod (Railway)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

# JPA + Hibernate (comun)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------ Seguridad JWT (API REST) ------------------
# Clave secreta para firmar el token (HMAC-SHA256, minimo 32 caracteres).
app.jwt.secret=${JWT_SECRET:ClinicaLimaSalud2026_ClaveSecretaJWT_MarcosDesarrolloWeb}
# Tiempo de expiracion del token en milisegundos (3600000 ms = 1 hora).
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
