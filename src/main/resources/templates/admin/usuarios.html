<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Usuarios | Clinica Lima</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin/usuarios}">
            <i class="bi bi-people-fill"></i> Usuarios del Sistema
        </a>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" th:href="@{/medico/agenda}">Portal medico</a>
            <form th:action="@{/logout}" method="post" class="mb-0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="btn btn-outline-light btn-sm" type="submit">Cerrar sesion</button>
            </form>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>
    <div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="fw-bold mb-1" style="color:#1e3a8a;">CRUD de Usuarios</h1>
            <p class="text-muted mb-0">Persistencia en MySQL mediante JPA + Hibernate.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/admin/usuarios/nuevo}">
            <i class="bi bi-person-plus"></i> Nuevo usuario
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Rol</th>
                    <th>Paciente</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="usuario : ${usuarios}">
                    <td th:text="${usuario.id}">1</td>
                    <td th:text="${usuario.username}">user</td>
                    <td th:text="${usuario.nombreCompleto}">Nombre</td>
                    <td th:text="${usuario.correo}">correo</td>
                    <td><span class="badge bg-secondary" th:text="${usuario.rol}">ROL</span></td>
                    <td th:text="${usuario.paciente != null ? usuario.paciente.nombreCompleto : '-'}">-</td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary" th:href="@{/admin/usuarios/{id}/editar(id=${usuario.id})}">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/admin/usuarios/{id}/eliminar(id=${usuario.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Eliminar este usuario?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-sm btn-outline-danger" type="submit">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="7" class="text-center text-muted py-4">No hay usuarios registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
