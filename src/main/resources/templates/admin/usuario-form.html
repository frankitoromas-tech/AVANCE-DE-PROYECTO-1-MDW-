<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editando} ? 'Editar usuario' : 'Nuevo usuario'">Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0 shadow">
                <div class="card-body p-4">
                    <h2 class="fw-bold mb-3" style="color:#1e3a8a;"
                        th:text="${editando} ? 'Editar usuario' : 'Registrar usuario'">Formulario</h2>
                    <div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>

                    <form th:action="${editando} ? @{/admin/usuarios/{id}(id=${usuarioForm.id})} : @{/admin/usuarios}"
                          th:object="${usuarioForm}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <div class="mb-3">
                            <label class="form-label">Usuario *</label>
                            <input type="text" class="form-control" th:field="*{username}" required>
                            <div class="text-danger small" th:errors="*{username}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Nombre completo *</label>
                            <input type="text" class="form-control" th:field="*{nombreCompleto}" required>
                            <div class="text-danger small" th:errors="*{nombreCompleto}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo *</label>
                            <input type="email" class="form-control" th:field="*{correo}" required>
                            <div class="text-danger small" th:errors="*{correo}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" th:text="${editando} ? 'Contrasena (dejar vacio para mantener)' : 'Contrasena *'">Contrasena</label>
                            <input type="password" class="form-control" th:field="*{password}" th:required="${!editando}">
                            <div class="text-danger small" th:errors="*{password}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Rol *</label>
                            <select class="form-select" th:field="*{rol}" required>
                                <option value="">Seleccione...</option>
                                <option th:each="rol : ${roles}" th:value="${rol}" th:text="${rol}">ROL</option>
                            </select>
                            <div class="text-danger small" th:errors="*{rol}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Paciente asociado (solo rol PACIENTE)</label>
                            <select class="form-select" th:field="*{pacienteId}">
                                <option value="">Ninguno</option>
                                <option th:each="paciente : ${pacientes}"
                                        th:value="${paciente.id}"
                                        th:text="${paciente.nombreCompleto + ' - DNI ' + paciente.dni}">Paciente</option>
                            </select>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Guardar</button>
                            <a class="btn btn-secondary" th:href="@{/admin/usuarios}">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
