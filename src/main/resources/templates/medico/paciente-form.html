<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Paciente | Clinica Lima</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0 shadow">
                <div class="card-body p-4">
                    <h2 class="fw-bold mb-3" style="color:#1e3a8a;">Editar paciente</h2>
                    <form th:action="@{/pacientes/{id}(id=${pacienteId})}" th:object="${pacienteForm}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="mb-3">
                            <label class="form-label">Nombre completo *</label>
                            <input type="text" class="form-control" th:field="*{nombreCompleto}" required>
                            <div class="text-danger small" th:errors="*{nombreCompleto}"></div>
                        </div>
                        <div class="row g-2">
                            <div class="col-6 mb-3">
                                <label class="form-label">DNI *</label>
                                <input type="text" class="form-control" th:field="*{dni}" maxlength="8" required>
                                <div class="text-danger small" th:errors="*{dni}"></div>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Edad *</label>
                                <input type="number" class="form-control" th:field="*{edad}" min="0" max="120" required>
                                <div class="text-danger small" th:errors="*{edad}"></div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Parentesco *</label>
                            <input type="text" class="form-control" th:field="*{parentesco}" required>
                            <div class="text-danger small" th:errors="*{parentesco}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Telefono *</label>
                            <input type="text" class="form-control" th:field="*{telefono}" required>
                            <div class="text-danger small" th:errors="*{telefono}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo *</label>
                            <input type="email" class="form-control" th:field="*{correo}" required>
                            <div class="text-danger small" th:errors="*{correo}"></div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Actualizar</button>
                            <a class="btn btn-secondary" th:href="@{/medico/agenda}">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
