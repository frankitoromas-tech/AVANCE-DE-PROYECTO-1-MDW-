<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cita | Clinica Lima</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card border-0 shadow">
                <div class="card-body p-4">
                    <h2 class="fw-bold mb-3" style="color:#1e3a8a;">Editar cita medica</h2>
                    <form th:action="@{/citas/{id}(id=${citaForm.id})}" th:object="${citaForm}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <div class="mb-3">
                            <label class="form-label">Paciente *</label>
                            <select class="form-select" th:field="*{pacienteId}" required>
                                <option value="">Seleccione...</option>
                                <option th:each="paciente : ${pacientes}"
                                        th:value="${paciente.id}"
                                        th:text="${paciente.nombreCompleto + ' - DNI ' + paciente.dni}">Paciente</option>
                            </select>
                            <div class="text-danger small" th:errors="*{pacienteId}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Horario *</label>
                            <select class="form-select" th:field="*{horarioId}" required>
                                <option value="">Seleccione...</option>
                                <option th:each="horario : ${horarios}"
                                        th:value="${horario.id}"
                                        th:text="${horario.servicioNombre + ' - ' + horario.nombreMedico + ' | ' + horario.dia + ' ' + horario.hora}">
                                    Horario
                                </option>
                            </select>
                            <div class="text-danger small" th:errors="*{horarioId}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Estado *</label>
                            <select class="form-select" th:field="*{estado}" required>
                                <option value="Programada">Programada</option>
                                <option value="Confirmada">Confirmada</option>
                                <option value="Atendida">Atendida</option>
                                <option value="Cancelada">Cancelada</option>
                            </select>
                            <div class="text-danger small" th:errors="*{estado}"></div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-success">Guardar cambios</button>
                            <a class="btn btn-secondary" th:href="@{/medico/agenda}">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
