<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/head :: common('Login Clínica')}"></th:block>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/login_Medico.css}">
</head>
<body th:attr="data-toast=${toastMensaje},data-show-register=${mostrarRegistro != null and mostrarRegistro ? 'true' : 'false'}">

<div class="container-fluid vh-100">
    <div class="row h-100">
        <div class="col-md-7 col-lg-8 d-none d-md-block p-0 bg-image-container">
            <img th:src="@{/Imagenes/FondoSesion.jpg}" alt="Fondo Clínica" class="bg-image" style="width: 100%; height: 100%; object-fit: cover;">
        </div>

        <div class="col-12 col-md-5 col-lg-4 d-flex align-items-center justify-content-center bg-light">
            <div class="login-box w-100 px-4 px-md-5">
                <div class="text-start mb-3">
                    <a th:href="@{/}" class="text-decoration-none text-secondary small fw-bold">
                        <i class="bi bi-arrow-left"></i> Volver al inicio
                    </a>
                </div>

                <div class="text-center mb-4">
                    <img th:src="@{/Imagenes/Logo.png}" alt="Logo Clínica Lima" class="img-fluid mb-3" style="max-width: 150px; object-fit: contain;">
                    <h2 class="fw-bold" style="color: #1e3a8a;">Bienvenido</h2>
                </div>

                <div class="auth-tabs-wrap mb-4">
                    <button class="auth-tab-btn is-active" id="tabLogin" type="button" data-auth-tab="login">Ingresar</button>
                    <button class="auth-tab-btn" id="tabRegister" type="button" data-auth-tab="register">Registrarse</button>
                </div>

                <div class="alert alert-danger" th:if="${errorLogin}" th:text="${errorLogin}"></div>

                <form id="loginForm" class="needs-validation" novalidate th:action="@{/usuarios/login}" th:object="${loginForm}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Usuario</label>
                        <input type="text" class="form-control p-2" id="username" th:field="*{username}" placeholder="Ingresa tu usuario" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Contraseña</label>
                        <div class="input-group">
                            <input type="password" class="form-control p-2" id="password" th:field="*{password}" placeholder="Tu contraseña" required>
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword">👁</button>
                        </div>
                    </div>

                    <button type="submit" class="btn text-white w-100 rounded-pill py-2 fw-bold custom-btn" style="background-color: #2563eb;">
                        Ingresar
                    </button>
                </form>

                <form id="registerForm" class="needs-validation d-none" novalidate th:action="@{/usuarios/registro}" th:object="${registroForm}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nombre Completo</label>
                        <input type="text" class="form-control p-2" th:field="*{nombreCompleto}" placeholder="Juan Pérez" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Correo Electrónico</label>
                        <input type="email" class="form-control p-2" th:field="*{correo}" placeholder="juan@correo.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Crear Contraseña</label>
                        <input type="password" class="form-control p-2" th:field="*{password}" placeholder="Mínimo 8 caracteres" required>
                    </div>
                    <button type="submit" class="btn text-white w-100 rounded-pill py-2 fw-bold" style="background-color: #00b8a9;">
                        Registrarme
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 2000">
    <div id="toastExito" class="toast text-bg-success border-0" role="alert">
        <div class="d-flex align-items-center p-2">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span id="toastMsg" th:text="${toastMensaje != null ? toastMensaje : 'Proceso completado'}">Proceso completado</span>
            <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<div th:replace="~{fragments/scripts :: bootstrap}"></div>
<script th:src="@{/js/login-medico.js}"></script>
</body>
</html>
