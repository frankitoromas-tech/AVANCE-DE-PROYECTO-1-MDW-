<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Clinica Lima</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/login-medico.css}">
</head>
<body>
<div class="container-fluid vh-100">
    <div class="row h-100">
        <div class="col-md-7 col-lg-8 d-none d-md-block p-0 bg-image-container">
            <img th:src="@{/images/FondoSesion.jpg}" alt="Fondo Clinica" class="bg-image">
        </div>
        <div class="col-12 col-md-5 col-lg-4 d-flex align-items-center justify-content-center bg-light">
            <div class="login-box w-100 px-4 px-md-5">
                <div class="text-start mb-3">
                    <a th:href="@{/}" class="text-decoration-none text-secondary small fw-bold">
                        <i class="bi bi-arrow-left"></i> Volver al inicio
                    </a>
                </div>
                <div class="text-center mb-4">
                    <img th:src="@{/images/Logo.png}" alt="Logo Clinica Lima" class="img-fluid mb-3" style="max-width: 150px; object-fit: contain;">
                    <h2 class="fw-bold" style="color: #1e3a8a;">Bienvenido</h2>
                </div>

                <div th:if="${errorLogin}" class="alert alert-danger py-2">Usuario o contrasena incorrectos.</div>
                <div th:if="${logoutOk}" class="alert alert-info py-2">Sesion cerrada correctamente.</div>
                <div th:if="${mensajeExito}" class="alert alert-success py-2" th:text="${mensajeExito}"></div>
                <div th:if="${mensajeError}" class="alert alert-danger py-2" th:text="${mensajeError}"></div>

                <div class="auth-tabs-wrap mb-4">
                    <button class="auth-tab-btn" th:classappend="${!mostrarRegistro} ? 'is-active' : ''" id="tabLogin" type="button" onclick="switchTab('login')">Ingresar</button>
                    <button class="auth-tab-btn" th:classappend="${mostrarRegistro} ? 'is-active' : ''" id="tabRegister" type="button" onclick="switchTab('register')">Registrarse</button>
                </div>

                <form id="loginForm" th:classappend="${mostrarRegistro} ? 'd-none' : ''" th:action="@{/login}" method="post" class="needs-validation">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Usuario</label>
                        <input type="text" class="form-control p-2" id="username" name="username" placeholder="Ingresa tu usuario" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Contrasena</label>
                        <div class="input-group">
                            <input type="password" class="form-control p-2" id="password" name="password" placeholder="Tu contrasena" required>
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword"><i class="bi bi-eye"></i></button>
                        </div>
                    </div>
                    <button type="submit" class="btn text-white w-100 rounded-pill py-2 fw-bold custom-btn" style="background-color: #2563eb;">Ingresar</button>
                    <div class="alert alert-secondary small mt-3 mb-0">
                        Demo: <strong>paciente</strong> / Paciente2026! · <strong>medico</strong> / Medico2026! · <strong>admin</strong> / Admin2026!
                    </div>
                </form>

                <form id="registerForm" th:classappend="${!mostrarRegistro} ? 'd-none' : ''" th:action="@{/usuarios/registrar}" th:object="${registroForm}" method="post" class="needs-validation">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <div class="mb-2">
                        <label class="form-label fw-semibold">Usuario</label>
                        <input type="text" id="registerUsername" name="username" class="form-control p-2" th:value="*{username}" placeholder="usuario.paciente" required>
                        <div class="text-danger small" th:errors="*{username}"></div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label fw-semibold">Nombre completo</label>
                        <input type="text" id="registerNombreCompleto" name="nombreCompleto" class="form-control p-2" th:value="*{nombreCompleto}" placeholder="Juan Perez" required>
                        <div class="text-danger small" th:errors="*{nombreCompleto}"></div>
                    </div>
                    <div class="row g-2">
                        <div class="col-6 mb-2">
                            <label class="form-label fw-semibold">DNI</label>
                            <input type="text" id="registerDni" name="dni" class="form-control p-2" th:value="*{dni}" maxlength="8" required>
                            <div class="text-danger small" th:errors="*{dni}"></div>
                        </div>
                        <div class="col-6 mb-2">
                            <label class="form-label fw-semibold">Edad</label>
                            <input type="number" id="registerEdad" name="edad" class="form-control p-2" th:value="*{edad}" min="0" max="120" required>
                            <div class="text-danger small" th:errors="*{edad}"></div>
                        </div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label fw-semibold">Telefono</label>
                        <input type="text" id="registerTelefono" name="telefono" class="form-control p-2" th:value="*{telefono}" placeholder="987654321" required>
                        <div class="text-danger small" th:errors="*{telefono}"></div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label fw-semibold">Correo electronico</label>
                        <input type="email" id="registerCorreo" name="correo" class="form-control p-2" th:value="*{correo}" placeholder="juan@correo.com" required>
                        <div class="text-danger small" th:errors="*{correo}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Crear contrasena</label>
                        <input type="password" id="registerPassword" name="password" class="form-control p-2" th:value="*{password}" placeholder="Minimo 8 caracteres" required>
                        <div class="text-danger small" th:errors="*{password}"></div>
                    </div>
                    <button type="submit" class="btn text-white w-100 rounded-pill py-2 fw-bold" style="background-color: #00b8a9;">Registrarme</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
