# =============================================================================
#  Perfil H2 (desarrollo / demo / evidencias)
#  Base de datos en memoria: permite ejecutar la app SIN instalar MySQL.
#  Uso:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
#  Los perfiles local y prod siguen usando MySQL; este perfil no los afecta.
# =============================================================================

spring.datasource.url=jdbc:h2:mem:limasalud;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Consola web de H2 para inspeccionar los datos: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:limasalud  -  Usuario: sa  -  sin contrasena)
spring.h2.console.enabled=true
