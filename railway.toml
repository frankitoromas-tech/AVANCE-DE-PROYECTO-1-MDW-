# Lima Salud — despliegue en Railway
# Panel: Settings → Root Directory = vacio (raiz del repo, pom.xml aqui)
# Variables: SPRING_PROFILES_ACTIVE=prod + MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD

[build]
builder = "RAILPACK"
buildCommand = "mvn -B -DskipTests clean package"

[deploy]
startCommand = "java -Dspring.profiles.active=prod -jar target/lima-salud-0.0.1-SNAPSHOT.jar"
healthcheckPath = "/"
restartPolicyType = "ON_FAILURE"
